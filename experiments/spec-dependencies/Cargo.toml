[workspace]
members = ["native", "ui", "desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
turso = { version = "=0.8.2", default-features = false }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-normalization = "=0.1.24"
caseless = "=0.2.2"

[profile.release]
opt-level = "s"

