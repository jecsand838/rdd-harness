[package]
name = "dependency-desktop-probe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
rdd-contracts = { path = "../../../gen/rust" }
prost = "=0.14.4"
tauri = { version = "=2.12.1", default-features = false, features = ["wry", "compression"] }
tauri-plugin-dialog = { version = "=2.8.1", default-features = false }
turso.workspace = true
tokio.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
