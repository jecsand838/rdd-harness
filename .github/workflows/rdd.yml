name: rdd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'rdd/**', 'codex/*-baseline']
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      candidate:
        description: Exact committed candidate SHA for full native harness qualification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rdd-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RDD_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate || github.sha }}
  RDD_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  RDD_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
  RDD_BASE_BRANCH: ${{ github.base_ref }}
  RDD_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  RDD_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  selection:
    name: Select required verification lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      root: ${{ steps.verifier.outputs.root }}
      policy_root: ${{ steps.verifier.outputs.policy_root }}
      policy_sha: ${{ steps.verifier.outputs.policy_sha }}
      release_policy: ${{ steps.verifier.outputs.release_policy }}
      release_source: ${{ steps.verifier.outputs.release_source }}
      prepared: ${{ steps.verifier.outputs.prepared }}
      mode: ${{ steps.verifier.outputs.mode }}
      application_complete: ${{ steps.verifier.outputs.application_complete }}
      full: ${{ steps.verifier.outputs.full }}
      portability: ${{ steps.verifier.outputs.portability }}
      lightweight: ${{ steps.verifier.outputs.lightweight }}
      trusted: ${{ steps.verifier.outputs.trusted }}
      controller: ${{ steps.verifier.outputs.controller }}
      full_matrix: ${{ steps.verifier.outputs.full_matrix }}
      controller_matrix: ${{ steps.hosts.outputs.matrix || steps.verifier.outputs.controller_matrix }}
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_POLICY_SHA }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Set up controller Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Select trusted base or initial-import verifier and required lanes
        id: verifier
        env:
          RDD_RELEASE_POLICY_SHA: ${{ vars.RDD_RELEASE_POLICY_SHA }}
          RDD_RELEASE_SOURCE_SHA: ${{ vars.RDD_RELEASE_SOURCE_SHA }}
          RDD_DISPATCH_CANDIDATE: ${{ inputs.candidate }}
        run: |
          python - <<'RDD_SELECT_VERIFIER'
          import os
          import json
          import subprocess
          from pathlib import Path
          import re
          baseline = Path("baseline")
          candidate = Path("candidate")
          required = (".rdd/config.json", "tools/rdd/cli.py")
          frozen = (".rdd/spec.lock.json", ".rdd/plan/plan.lock.json", ".rdd/prepared.json")
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          branch = os.environ["RDD_HEAD_BRANCH"]
          dispatch = event == "workflow_dispatch"
          if dispatch:
              candidate_sha = os.environ.get("RDD_DISPATCH_CANDIDATE", "")
              if (not re.fullmatch(r"[0-9a-f]{40}", candidate_sha)
                      or candidate_sha != os.environ.get("GITHUB_SHA")
                      or candidate_sha != os.environ.get("RDD_HEAD_SHA")):
                  raise SystemExit("Native qualification requires the exact full candidate SHA and matching dispatch ref")
          release = branch.startswith("codex/rdd-release/") and not dispatch
          release_policy = release_source = ""
          if release:
              if (os.environ.get("GITHUB_EVENT_NAME") != "pull_request"
                      or os.environ.get("RDD_BASE_BRANCH") != "main"
                      or not os.environ.get("GITHUB_REPOSITORY")
                      or os.environ.get("RDD_HEAD_REPOSITORY") != os.environ["GITHUB_REPOSITORY"]
                      or os.environ.get("RDD_BASE_REPOSITORY") != os.environ["GITHUB_REPOSITORY"]):
                  raise SystemExit("Release requires a same-repository pull request targeting main")
              if not re.fullmatch(r"codex/rdd-release/[A-Za-z0-9][A-Za-z0-9._-]{0,63}", os.environ["RDD_HEAD_BRANCH"]):
                  raise SystemExit("Release branch is not canonical")
              release_policy = os.environ.get("RDD_RELEASE_POLICY_SHA", "")
              release_source = os.environ.get("RDD_RELEASE_SOURCE_SHA", "")
              if not all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (release_policy, release_source)):
                  raise SystemExit("Release requires paired full policy and source SHA repository variables")
              if release_source != os.environ.get("RDD_HEAD_SHA"):
                  raise SystemExit("Release source repository variable does not match the exact PR head")
          if all((baseline / path).is_file() for path in required):
              selected = "baseline"
          else:
              if release:
                  raise SystemExit("Release requires a complete trusted base verifier; bootstrap is forbidden")
              if any((baseline / path).exists() or (baseline / path).is_symlink()
                     for path in (".rdd", "tools/rdd")):
                  raise SystemExit("Trusted base contains a partial harness; bootstrap is forbidden")
              if not all((candidate / path).is_file() for path in required):
                  raise SystemExit("Initial import requires a complete candidate harness")
              if any((candidate / path).exists() or (candidate / path).is_symlink() for path in frozen):
                  raise SystemExit("Initial import cannot contain frozen specification, plan, or preparation artifacts")
              if os.environ["RDD_HEAD_BRANCH"].startswith("rdd/"):
                  raise SystemExit("Initial import cannot use an RDD phase branch")
              selected = "candidate"
          policy_root = "prepared-policy" if release else selected
          policy_sha = release_policy if release else os.environ.get("RDD_POLICY_SHA", "")
          prepared = release or all((Path(policy_root) / path).is_file() for path in frozen)

          def present(root, paths):
              return any((root / path).exists() or (root / path).is_symlink() for path in paths)


          def docs_only():
              # Read Git records as data. Never source candidate paths or execute their contents.
              policy = json.loads((baseline / ".rdd/config.json").read_text(encoding="utf-8"))
              if not isinstance(policy, dict):
                  return False
              prefixes, files = policy.get("protected_prefixes", []), policy.get("protected_files", [])
              if not all(isinstance(values, list) and all(isinstance(value, str) for value in values)
                         for values in (prefixes, files)):
                  return False
              before, after = os.environ.get("RDD_POLICY_SHA", ""), os.environ.get("RDD_HEAD_SHA", "")
              if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (before, after)):
                  return False
              def git(*arguments):
                  return subprocess.run(["git", "-C", str(candidate), *arguments], check=True,
                                        capture_output=True, timeout=30).stdout
              def document(path, sha):
                  parts = path.split("/")
                  if (any(part in {"", ".", ".."} for part in parts)
                          or parts[-1].casefold() in {"agents.md", "skill.md"}
                          or path in files or any(path.startswith(prefix) for prefix in prefixes)
                          or not (path == "README.md" or path.startswith("docs/harness/") and path.endswith(".md"))):
                      return False
                  entries = git("ls-tree", "-z", sha, "--", path).split(b"\0")
                  entries = [entry for entry in entries if entry]
                  return len(entries) == 1 and entries[0].split(b" ", 1)[0] in {b"100644", b"100755"}
              records = git("diff", "--name-status", "-z", "--find-renames", before, after, "--").split(b"\0")
              if records[-1:] != [b""]:
                  return False
              records.pop()
              if not records:
                  return False
              while records:
                  status = records.pop(0).decode("ascii")
                  if status in {"A", "M", "D"}:
                      if not records:
                          return False
                      path = records.pop(0).decode("utf-8")
                      revisions = (before,) if status == "D" else (after,) if status == "A" else (before, after)
                      if not all(document(path, sha) for sha in revisions):
                          return False
                  elif re.fullmatch(r"R[0-9]{1,3}", status):
                      if len(records) < 2:
                          return False
                      old_path, new_path = (records.pop(0).decode("utf-8") for _ in range(2))
                      if not document(old_path, before) or not document(new_path, after):
                          return False
                  else:
                      return False
              return True

          maintenance = (event == "pull_request" and os.environ.get("RDD_BASE_BRANCH") == "main"
                         and selected == "baseline" and all((candidate / path).is_file() for path in required)
                         and not branch.startswith(("rdd/", "codex/rdd-release/"))
                         and not present(baseline, frozen) and not present(candidate, frozen))
          full = portability = lightweight = trusted = controller = False
          full_matrix = {"os": ["ubuntu-24.04"]}
          controller_matrix = {"os": ["ubuntu-24.04"]}
          mode = "frozen_policy"
          if dispatch:
              mode, full = "native_qualification", True
              full_matrix = {"os": ["ubuntu-24.04", "macos-latest", "windows-latest"]}
          elif event == "push" and branch == "main":
              mode, lightweight = "harness_diagnostics", True
          elif maintenance:
              mode = "harness_maintenance"
              try:
                  lightweight = docs_only()
              except (subprocess.SubprocessError, UnicodeError, OSError, ValueError):
                  # Unknown Git records take the full lane; they never earn the cheap route.
                  lightweight = False
              full = portability = trusted = not lightweight
          else:
              controller = trusted = True
              if release:
                  full = True
                  full_matrix = {"os": ["ubuntu-24.04", "macos-latest", "windows-latest"]}
              elif selected == "candidate":
                  full = portability = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              values = dict(root=selected, policy_root=policy_root, policy_sha=policy_sha,
                            release_policy=release_policy, release_source=release_source,
                            prepared=str(prepared).lower(), mode=mode, application_complete="false",
                            full_matrix=json.dumps(full_matrix, separators=(",", ":")),
                            controller_matrix=json.dumps(controller_matrix, separators=(",", ":")))
              values.update({name: str(value).lower() for name, value in dict(
                  full=full, portability=portability, lightweight=lightweight, trusted=trusted, controller=controller).items()})
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"CI scope: `{mode}`; application_complete=false.\n")
          RDD_SELECT_VERIFIER

      - name: Check out approved prepared release policy
        if: steps.verifier.outputs.release_policy != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verifier.outputs.release_policy }}
          path: prepared-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Select every declared hosted frozen environment
        id: hosts
        if: steps.verifier.outputs.controller == 'true' && steps.verifier.outputs.prepared == 'true'
        env:
          RDD_VERIFIER_ROOT: ${{ steps.verifier.outputs.root }}
          RDD_POLICY_ROOT: ${{ steps.verifier.outputs.policy_root }}
        run: >-
          python "$GITHUB_WORKSPACE/$RDD_VERIFIER_ROOT/tools/rdd/ci_tools.py" matrix
          --root "$GITHUB_WORKSPACE/$RDD_POLICY_ROOT" --github-output "$GITHUB_OUTPUT"

  harness:
    name: harness (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.full_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.73.0'
          setup_only: 'true'
          pr_comment: 'false'
          push: 'false'
          archive: 'false'
      - name: Test candidate harness
        run: |
          python - <<'RDD_FULL_SELFTEST'
          import os, re, subprocess, sys, time
          command = [sys.executable, 'tools/rdd/cli.py', 'selftest']
          help_result = subprocess.run(command + ['--help'], capture_output=True, text=True, check=True)
          suite, timings = '--suite' in help_result.stdout, '--timings' in help_result.stdout
          if suite != timings or 'usage:' not in help_result.stdout or 'selftest' not in help_result.stdout:
              raise SystemExit('Candidate selftest help does not identify a supported CLI')
          if suite:
              command += ['--suite', 'full', '--timings', '.rdd/evidence/selftest-full.json']
          count, started = None, time.monotonic()
          with subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                                encoding='utf-8', errors='backslashreplace') as process:
              for line in process.stdout:
                  print(line, end='', flush=True)
                  match = re.search(r'^Ran ([0-9]+) tests? in |"tests_run":\s*([0-9]+)', line)
                  if match:
                      count = int(next(value for value in match.groups() if value is not None))
              code = process.wait()
          if not suite:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f"Suite: full (historical CLI); tests: {count if count is not None else 'unavailable'}; duration: {time.monotonic() - started:.3f}s; per-test timings unavailable; application_complete=false.\n")
          raise SystemExit(code)
          RDD_FULL_SELFTEST
      - name: Install pinned compiler and WASM target
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tomllib
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text(encoding='utf-8'))['toolchain']['channel']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', channel):
              raise SystemExit('Harness qualification requires an exact stable compiler')
          subprocess.run(['rustup', 'toolchain', 'install', channel, '--profile', 'minimal', '--target', 'wasm32-unknown-unknown'], check=True, timeout=1200)
          PYTHON
      - name: Qualify real providers and consumers across modules and targets
        run: python tools/proto-codegen/tests/test_generation.py
      - name: Preserve actual compiler proof logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-contracts-${{ matrix.os }}
          path: .rdd/evidence/harness-contracts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize candidate suite counts and durations
        if: always()
        env:
          RDD_TIMINGS: .rdd/evidence/selftest-full.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RDD_TIMINGS'])
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f"Suite: {data['suite']}; tests: {data['count']}; duration: {data['duration_seconds']:.3f}s; application_complete=false.\n")
                  for test in sorted(data['tests'], key=lambda item: item['duration_seconds'], reverse=True)[:10]:
                      summary.write(f"- {test['id']}: {test['duration_seconds']:.3f}s ({test['outcome']})\n")
          PY
      - name: Preserve candidate suite timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-full-${{ matrix.os }}
          path: .rdd/evidence/selftest-full.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  portability:
    name: portability (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.portability == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Test candidate portability
        run: python tools/rdd/cli.py selftest --suite portability --timings .rdd/evidence/selftest-portability.json
      - name: Summarize candidate suite counts and durations
        if: always()
        env:
          RDD_TIMINGS: .rdd/evidence/selftest-portability.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RDD_TIMINGS'])
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f"Suite: {data['suite']}; tests: {data['count']}; duration: {data['duration_seconds']:.3f}s; application_complete=false.\n")
                  for test in sorted(data['tests'], key=lambda item: item['duration_seconds'], reverse=True)[:10]:
                      summary.write(f"- {test['id']}: {test['duration_seconds']:.3f}s ({test['outcome']})\n")
          PY
      - name: Preserve candidate suite timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-portability-${{ matrix.os }}
          path: .rdd/evidence/selftest-portability.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  lightweight:
    name: Lightweight Linux harness diagnostics
    needs: selection
    if: needs.selection.outputs.lightweight == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Test lightweight candidate diagnostics
        run: python tools/rdd/cli.py selftest --suite portability --timings .rdd/evidence/selftest-lightweight.json
      - name: Summarize candidate suite counts and durations
        if: always()
        env:
          RDD_TIMINGS: .rdd/evidence/selftest-lightweight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RDD_TIMINGS'])
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f"Suite: {data['suite']}; tests: {data['count']}; duration: {data['duration_seconds']:.3f}s; application_complete=false.\n")
                  for test in sorted(data['tests'], key=lambda item: item['duration_seconds'], reverse=True)[:10]:
                      summary.write(f"- {test['id']}: {test['duration_seconds']:.3f}s ({test['outcome']})\n")
          PY
      - name: Preserve candidate suite timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-lightweight-linux
          path: .rdd/evidence/selftest-lightweight.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  trusted:
    name: Trusted verifier selftest (Linux)
    needs: selection
    if: needs.selection.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.selection.outputs.root == 'candidate' && env.RDD_HEAD_SHA || env.RDD_POLICY_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Test selected trusted harness with historical CLI compatibility
        run: |
          python - <<'RDD_TRUSTED_SELFTEST'
          import os, re, subprocess, sys, time
          count, started = None, time.monotonic()
          with subprocess.Popen([sys.executable, 'tools/rdd/cli.py', 'selftest'], stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='backslashreplace') as process:
              for line in process.stdout:
                  print(line, end='', flush=True)
                  match = re.search(r'^Ran ([0-9]+) tests? in |"tests_run":\s*([0-9]+)', line)
                  if match:
                      count = int(next(value for value in match.groups() if value is not None))
              code = process.wait()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Suite: full (trusted CLI); tests: {count if count is not None else 'unavailable'}; duration: {time.monotonic() - started:.3f}s; per-test timings unavailable; application_complete=false.\n")
          raise SystemExit(code)
          RDD_TRUSTED_SELFTEST

  controller:
    name: controller (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.controller == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.controller_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_POLICY_SHA }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Check out approved prepared release policy
        if: needs.selection.outputs.release_policy != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.selection.outputs.release_policy }}
          path: prepared-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Set up controller Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Read tool pins from trusted prepared policy
        if: needs.selection.outputs.prepared == 'true'
        id: tools
        env:
          RDD_POLICY_ROOT: ${{ needs.selection.outputs.policy_root }}
        run: >-
          python "$GITHUB_WORKSPACE/$RDD_POLICY_ROOT/tools/rdd/ci_tools.py" describe
          --root "$GITHUB_WORKSPACE/$RDD_POLICY_ROOT" --github-output "$GITHUB_OUTPUT"

      - name: Select qualified Python
        if: needs.selection.outputs.prepared == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.tools.outputs.python }}

      - name: Install pinned Buf without schema publishing or PR comments
        if: needs.selection.outputs.prepared == 'true'
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ steps.tools.outputs.buf }}
          setup_only: 'true'
          pr_comment: 'false'
          push: 'false'
          archive: 'false'

      - name: Provision and measure declared Rust and frontend tools
        if: needs.selection.outputs.prepared == 'true'
        env:
          RDD_POLICY_ROOT: ${{ needs.selection.outputs.policy_root }}
        run: >-
          python "$GITHUB_WORKSPACE/$RDD_POLICY_ROOT/tools/rdd/ci_tools.py" provision
          --root "$GITHUB_WORKSPACE/$RDD_POLICY_ROOT"
          --evidence "$GITHUB_WORKSPACE/candidate/.rdd/evidence/provisioning"
          --candidate-root "$GITHUB_WORKSPACE/candidate"

      - name: Install Tauri Linux build prerequisites
        if: runner.os == 'Linux' && needs.selection.outputs.prepared == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Validate candidate with the selected controller and frozen check policy
        working-directory: candidate
        env:
          RDD_VERIFIER_ROOT: ${{ needs.selection.outputs.root }}
          RDD_POLICY_ROOT: ${{ needs.selection.outputs.policy_root }}
          RDD_SELECTED_RELEASE_POLICY: ${{ needs.selection.outputs.release_policy }}
          RDD_SELECTED_RELEASE_SOURCE: ${{ needs.selection.outputs.release_source }}
        run: |
          arguments=(--root "$GITHUB_WORKSPACE/candidate" ci
            --policy-root "$GITHUB_WORKSPACE/$RDD_POLICY_ROOT" --branch "$RDD_HEAD_BRANCH")
          if [[ -n "$RDD_SELECTED_RELEASE_POLICY" ]]; then
            arguments+=(--release-policy "$RDD_SELECTED_RELEASE_POLICY"
              --release-source "$RDD_SELECTED_RELEASE_SOURCE")
          fi
          python "$GITHUB_WORKSPACE/$RDD_VERIFIER_ROOT/tools/rdd/cli.py" "${arguments[@]}"

      - name: Preserve CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdd-ci-${{ matrix.os }}-${{ env.RDD_HEAD_SHA }}
          path: |
            candidate/.rdd/evidence/ci.json
            candidate/.rdd/evidence/provisioning/
            candidate/.rdd/evidence/checks/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify:
    # Only PR runs publish the base-bound required check named verify.
    name: ${{ github.event_name == 'workflow_dispatch' && 'native qualification' || github.event_name == 'push' && 'harness diagnostics' || 'verify' }}
    needs: [selection, harness, portability, lightweight, trusted, controller]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RDD_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every selected lane and reject unexpected job execution
        shell: bash
        run: |
          python - <<'RDD_VERIFY_JOBS'
          import json, os
          needs = json.loads(os.environ['RDD_NEEDS'])
          selection = needs.get('selection', {})
          if selection.get('result') != 'success':
              raise SystemExit('Verification lane selection did not succeed')
          flags = selection.get('outputs', {})
          jobs = dict(full='harness', portability='portability', lightweight='lightweight',
                      trusted='trusted', controller='controller')
          for flag, job in jobs.items():
              if flags.get(flag) not in {'true', 'false'}:
                  raise SystemExit(f'Missing required selection output: {flag}')
              expected = 'success' if flags[flag] == 'true' else 'skipped'
              actual = needs.get(job, {}).get('result')
              if actual != expected:
                  raise SystemExit(f'{job}: expected {expected}, observed {actual}')
          RDD_VERIFY_JOBS
