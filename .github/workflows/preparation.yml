name: rdd-preparation

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact committed materialization SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rdd-preparation-${{ github.ref }}
  cancel-in-progress: true

env:
  RDD_HEAD_SHA: ${{ inputs.candidate }}
  RDD_HARNESS_SHA: ${{ vars.RDD_PREPARATION_HARNESS_SHA }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  environments:
    name: Select declared preparation environments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Require full candidate and independently selected harness pins
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
              raise SystemExit('Preparation requires explicit workflow dispatch')
          if not re.fullmatch(r'refs/heads/codex/[A-Za-z0-9][A-Za-z0-9._-]*-baseline', os.environ.get('GITHUB_REF', '')):
              raise SystemExit('Preparation dispatch must use a single-component codex baseline branch ref')
          if os.environ.get('GITHUB_SHA') != os.environ.get('RDD_HEAD_SHA'):
              raise SystemExit('Preparation candidate must match the exact dispatch branch revision')
          for name in ('RDD_HEAD_SHA', 'RDD_HARNESS_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get(name, '')):
                  raise SystemExit(f'{name} must be an explicitly pinned full commit SHA')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HARNESS_SHA }}
          path: harness
          persist-credentials: false
      - id: environments
        name: Select fixed runners from frozen environment declarations
        shell: bash
        run: >-
          python harness/tools/rdd/ci_tools.py matrix --root candidate
          --github-output "$GITHUB_OUTPUT"

  preparation:
    name: preparation (${{ matrix.os }})
    needs: environments
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.environments.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HEAD_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RDD_HARNESS_SHA }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Read declared tool pins
        id: tools
        run: >-
          python harness/tools/rdd/ci_tools.py describe --root candidate
          --github-output "$GITHUB_OUTPUT"

      - name: Select qualified Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.tools.outputs.python }}

      - name: Install pinned Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ steps.tools.outputs.buf }}
          setup_only: 'true'
          pr_comment: 'false'
          push: 'false'
          archive: 'false'

      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Provision and measure declared tools
        run: >-
          python harness/tools/rdd/ci_tools.py provision --root candidate
          --evidence candidate/.rdd/evidence/provisioning

      - name: Verify committed preparation with trusted controller
        working-directory: candidate
        run: >-
          python "$GITHUB_WORKSPACE/harness/tools/rdd/cli.py" --root . ci
          --preparation --harness-source "$RDD_HARNESS_SHA"
          --policy-root "$GITHUB_WORKSPACE/harness"

      - name: Preserve preparation evidence for transfer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdd-preparation-${{ matrix.os }}-${{ env.RDD_HEAD_SHA }}
          path: |
            candidate/.rdd/evidence/preparation-ci.json
            candidate/.rdd/evidence/preparation-ci/
            candidate/.rdd/evidence/provisioning/
            candidate/.rdd/evidence/checks/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
