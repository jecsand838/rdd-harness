syntax = "proto3";
package todo.selected_files.v1;

enum Mode { MODE_UNSPECIFIED = 0; MODE_IMPORT = 1; MODE_EXPORT = 2; }
enum ErrorCode { ERROR_CODE_UNSPECIFIED = 0; ERROR_CODE_CANCELLED = 1; ERROR_CODE_DENIED = 2; ERROR_CODE_UNSUPPORTED = 3; ERROR_CODE_PROTECTED = 4; ERROR_CODE_REJECTED = 5; ERROR_CODE_UNCERTAIN = 6; ERROR_CODE_INVALID_HANDLE = 7; }
message Failure { ErrorCode code = 1; string correlation_id = 2; }
message Grant { string handle = 1; string display_label = 2; bool exists = 3; bytes identity = 4; }
message SelectRequest { Mode mode = 1; }
message ReadRequest { string grant = 1; uint64 offset = 2; uint32 chunk_bytes = 3; }
message Chunk { bytes data = 1; bool eof = 2; bytes identity = 3; }
message ProbeRequest { string grant = 1; }
message Probe { bool supported = 1; bool exists = 2; bytes identity = 3; }
message Begin { string grant = 1; bytes expected_identity = 2; bool replace_confirmed = 3; }
message Append { string publication = 1; bytes data = 2; }
message Finish { string publication = 1; bytes expected_sha256 = 2; }
message PublishRequest { oneof action { Begin begin = 1; Append append = 2; Finish finish = 3; } }
message Publication { string handle = 1; bool complete = 2; bool uncertain = 3; string display_label = 4; }
message ResolveRequest { string publication = 1; }
message CleanupRequest { string handle = 1; }
message Cleaned {}
message SelectResponse { oneof outcome { Grant success = 1; Failure failure = 2; } }
message ReadResponse { oneof outcome { Chunk success = 1; Failure failure = 2; } }
message ProbeResponse { oneof outcome { Probe success = 1; Failure failure = 2; } }
message PublishResponse { oneof outcome { Publication success = 1; Failure failure = 2; } }
message ResolveResponse { oneof outcome { Publication success = 1; Failure failure = 2; } }
message CleanupResponse { oneof outcome { Cleaned success = 1; Failure failure = 2; } }

service SelectedFilesService {
  rpc Select(SelectRequest) returns (SelectResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc Cleanup(CleanupRequest) returns (CleanupResponse);
}
